name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Optional Secrets (Settings → Secrets and variables → Actions):
      #   VITE_SITE_PASSWORD — browse gate (default `notes` when unset)
      #   VITE_VISIT_LOG_ENDPOINT — JSON beacon webhook for access records
      #   VITE_VISIT_LOG_GEO / VITE_VISIT_LOG_GEO_URL — approx geo (optional)
      #   VITE_UMAMI_SRC + VITE_UMAMI_WEBSITE_ID — Umami
      #   VITE_PLAUSIBLE_DOMAIN / VITE_PLAUSIBLE_SRC — Plausible
      #   VITE_GOATCOUNTER_CODE — GoatCounter
      - name: Build
        env:
          VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}
          VITE_VISIT_LOG_ENDPOINT: ${{ secrets.VITE_VISIT_LOG_ENDPOINT }}
          VITE_VISIT_LOG_GEO: ${{ secrets.VITE_VISIT_LOG_GEO }}
          VITE_VISIT_LOG_GEO_URL: ${{ secrets.VITE_VISIT_LOG_GEO_URL }}
          VITE_UMAMI_SRC: ${{ secrets.VITE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ secrets.VITE_PLAUSIBLE_SRC }}
          VITE_GOATCOUNTER_CODE: ${{ secrets.VITE_GOATCOUNTER_CODE }}
        run: npm run build

      # Hard gate: private / __local gallery media must never ship to Pages.
      - name: Guard against private assets in dist
        run: |
          set -euo pipefail
          if find dist \( -path '*/private/*' -o -path '*/__local/*' \) | grep -q .; then
            echo "::error::Private/local media paths leaked into dist — refusing Pages upload"
            find dist \( -path '*/private/*' -o -path '*/__local/*' \) || true
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
